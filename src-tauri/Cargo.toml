[package]
name = "sqlnotebook"
version = "0.1.0"
description = "A lightweight SQL notebook for MySQL and SQL Server, built with Tauri"
edition = "2021"

[lib]
name = "sqlnotebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
mysql = "28.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "native-tls"] }
tokio = { version = "1.53.3", features = ["net", "rt", "macros"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
futures-util = "0.3.34"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
